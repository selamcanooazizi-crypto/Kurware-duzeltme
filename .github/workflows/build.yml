name: Build KurWare
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then
            Z=$(find . -iname '*.zip' -not -path './.git/*' | head -n 1)
            echo "Zip: $Z"
            mkdir -p /tmp/src
            unzip -q "$Z" -d /tmp/src
            S=$(find /tmp/src -name settings.gradle | head -n 1)
          fi
          DIR=$(dirname "$S")
          echo "Build klasoru: $DIR"
          cd "$DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: KurWare-jar
          path: out/*.jar
